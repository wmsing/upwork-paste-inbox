name: macOS build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build macos --release

      - name: Zip app
        run: |
          APP="build/macos/Build/Products/Release/Upwork Paste Inbox.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "Upwork-Paste-Inbox-macos-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Upwork-Paste-Inbox-macos
          path: Upwork-Paste-Inbox-macos-unsigned.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Upwork-Paste-Inbox-macos-unsigned.zip
          generate_release_notes: true
